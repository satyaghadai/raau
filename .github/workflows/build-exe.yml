name: Build and Release Windows Executable

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Disable Windows Defender scanning on runner
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywin32 wmi psutil reportlab

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "RAAU_Assessment_Utility" --clean --collect-all reportlab --collect-all psutil main.py

    - name: Zip Executable
      run: |
        Compress-Archive -Path dist/RAAU_Assessment_Utility/* -DestinationPath dist/RAAU_Windows_EXE.zip

    - name: Create Public Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/RAAU_Windows_EXE.zip
        tag_name: v1.0.${{ github.run_number }}
        name: RAAU Release v1.0.${{ github.run_number }}
        body: "Automated build of RAAU Windows Standalone Executable."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
